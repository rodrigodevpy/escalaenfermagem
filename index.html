<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escala Enfermagem</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Escala">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f1f5f9;--card:#fff;--txt:#0f172a;--mut:#64748b;--pri:#0f766e;--pri2:#ccfbf1;--fol:#d97706;--fol2:#fef3c7;--bd:#e2e8f0;--red:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--txt:#e5edf7;--mut:#94a3b8;--pri:#2dd4bf;--pri2:#134e4a;--fol:#fbbf24;--fol2:#451a03;--bd:#27344d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
@media(prefers-color-scheme:dark){header{color:#042f2e}}
header h1{font-size:18px;margin:0}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--pri);color:#fff;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#042f2e}}
button.sec{background:transparent;color:var(--txt);border:1px solid var(--bd)}
button.danger{background:var(--red);color:#fff}
button.ic{background:rgba(255,255,255,.2);color:inherit;padding:6px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav h2{margin:0;font-size:18px;text-transform:capitalize}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media(prefers-color-scheme:dark){.chip.on{color:#042f2e}}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dh{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.c{min-height:62px;border-radius:8px;border:1px solid var(--bd);padding:3px;font-size:12px;position:relative;cursor:pointer;overflow:hidden}
.c.out{visibility:hidden}
.c.today{outline:2px solid var(--pri)}
.c.sel{box-shadow:0 0 0 2px var(--txt)}
.c .n{font-weight:600;font-size:13px}
.c.P{background:var(--pri2)}
.c.F{background:var(--fol2)}
.tag{display:block;font-size:11px;font-weight:700;margin-top:2px}
.c.P .tag{color:var(--pri)}.c.F .tag{color:var(--fol)}
.bars{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.bar{font-size:10px;border-radius:4px;padding:0 3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:14px}
.bar.f{background:transparent!important;border:1px dashed;color:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.bP{background:var(--pri2);color:var(--pri)}.bF{background:var(--fol2);color:var(--fol)}
.mut{color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:18px}}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
input[type=color]{padding:2px;height:42px}
.big{font-size:22px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:8px}
.empty{text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header>
  <h1>🩺 Escala Enfermagem</h1>
  <div class="row"><button class="ic" onclick="openNurse()">＋ Enfermeiro</button><button class="ic" onclick="openMenu()">⋯</button></div>
</header>
<main id="app"></main>

<script>
const KEY='escala-enfermagem-v1';
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const CORES=['#0f766e','#2563eb','#9333ea','#db2777','#ea580c','#65a30d','#0891b2','#b45309'];
let S=load();

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.nurses))return s}catch(e){}
  const t=new Date();return{nurses:[],y:t.getFullYear(),m:t.getMonth(),sel:'all',day:null};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dn=(y,m,d)=>Math.round(Date.UTC(y,m,d)/864e5);
const D=n=>new Date(n*864e5);
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return dn(a,b-1,c)};
const isoOf=n=>D(n).toISOString().slice(0,10);
const fmt=n=>pad(D(n).getUTCDate())+'/'+pad(D(n).getUTCMonth()+1);
const dow=n=>D(n).getUTCDay();
const todayN=()=>{const t=new Date();return dn(t.getFullYear(),t.getMonth(),t.getDate())};

/* Núcleo do cálculo: 12x36 => plantão a cada 2 dias.
   A cada 5 plantões, o 6º "encaixe" vira FOLGA (dia do próximo plantão). Depois o ciclo recomeça. */
function sched(nurse,a,b){
  const m=new Map();
  const an=nurse.anchors.map(x=>({s:parse(x.date),d:x.done})).sort((p,q)=>p.s-q.s);
  for(let i=0;i<an.length;i++){
    const st=an[i].s,end=i+1<an.length?an[i+1].s:b+1;
    let k=Math.max(0,Math.floor((a-st)/2));
    for(;;k++){
      const day=st+2*k;
      if(day>=end||day>b)break;
      if(day<a)continue;
      m.set(day,(an[i].d+k)%6===5?'F':'P');
    }
  }
  return m;
}
const monthRange=(y,m)=>[dn(y,m,1),dn(y,m+1,0)];

function render(){
  const app=document.getElementById('app');
  if(!S.nurses.length){
    app.innerHTML=`<div class="card empty"><div class="big">Bem-vindo 👋</div><p class="mut">Cadastre o primeiro enfermeiro informando o dia em que começa o plantão. O app calcula plantões (12x36) e folgas do mês inteiro e continua automaticamente nos próximos meses.</p><button onclick="openNurse()">Cadastrar enfermeiro</button></div>`;
    return;
  }
  if(S.sel!=='all'&&!S.nurses.find(n=>n.id===S.sel))S.sel='all';
  const [a,b]=monthRange(S.y,S.m);
  const sc={};S.nurses.forEach(n=>sc[n.id]=sched(n,a,b));
  const list=S.sel==='all'?S.nurses:S.nurses.filter(n=>n.id===S.sel);
  let h='';
  h+=`<div class="chips"><button class="chip ${S.sel==='all'?'on':''}" onclick="setSel('all')">Todos</button>`+
    S.nurses.map(n=>`<button class="chip ${S.sel===n.id?'on':''}" onclick="setSel('${n.id}')"><span class="dot" style="background:${n.color}"></span>${esc(n.name)}</button>`).join('')+`</div>`;
  h+=`<div class="card"><div class="nav"><button class="sec" onclick="nav(-1)">‹</button><div style="text-align:center"><h2>${MES[S.m]} ${S.y}</h2><button class="sec" style="padding:2px 10px;font-size:12px;margin-top:2px" onclick="goToday()">Hoje</button></div><button class="sec" onclick="nav(1)">›</button></div>`;
  h+=`<div class="grid">`+DS.map(d=>`<div class="dh">${d}</div>`).join('');
  const first=dow(a);
  for(let i=0;i<first;i++)h+=`<div class="c out"></div>`;
  for(let d=a;d<=b;d++){
    let cls='c',inner='';
    if(d===todayN())cls+=' today';
    if(S.day===d)cls+=' sel';
    if(S.sel!=='all'){
      const t=sc[S.sel].get(d);
      if(t){cls+=' '+t;inner=`<span class="tag">${t==='P'?'🏥 12h':'🌴 Folga'}</span>`}
    }else{
      inner='<div class="bars">'+S.nurses.map(n=>{
        const t=sc[n.id].get(d);if(!t)return'';
        return `<div class="bar ${t==='F'?'f':''}" style="background:${n.color};color:${t==='F'?n.color:'#fff'};border-color:${n.color}">${t==='F'?'F ':''}${esc(n.name.split(' ')[0])}</div>`}).join('')+'</div>';
    }
    h+=`<div class="${cls}" onclick="pickDay(${d})"><div class="n">${D(d).getUTCDate()}</div>${inner}</div>`;
  }
  h+=`</div><div class="row mut" style="margin-top:10px"><span><span class="badge bP">P</span> Plantão 12h</span><span><span class="badge bF">F</span> Folga</span></div></div>`;

  if(S.day!=null){
    const rows=S.nurses.map(n=>{const t=sc[n.id].get(S.day);return t?`<tr><td><span class="dot" style="background:${n.color}"></span>${esc(n.name)}</td><td><span class="badge b${t}">${t==='P'?'Plantão':'Folga'}</span></td></tr>`:''}).join('');
    h+=`<div class="card"><b>${DS[dow(S.day)]}, ${fmt(S.day)}</b>${rows?`<table>${rows}</table>`:'<p class="mut">Ninguém escalado neste dia.</p>'}</div>`;
  }

  if(S.sel==='all'){
    h+=`<div class="card"><b>Resumo do mês</b><table><tr><th>Enfermeiro</th><th>Plantões</th><th>Horas</th><th>Folgas</th></tr>`+
      S.nurses.map(n=>{const v=[...sc[n.id].values()];const p=v.filter(x=>x==='P').length,f=v.length-p;
      return `<tr><td><span class="dot" style="background:${n.color}"></span>${esc(n.name)}</td><td>${p}</td><td>${p*12}h</td><td>${f}</td></tr>`}).join('')+`</table></div>`;
  }else{
    const n=list[0],mp=sc[n.id],ent=[...mp.entries()].sort((x,y)=>x[0]-y[0]);
    const p=ent.filter(e=>e[1]==='P'),f=ent.filter(e=>e[1]==='F');
    const par=new Set(p.map(e=>D(e[0]).getUTCDate()%2));
    const parTxt=!p.length?'—':par.size>1?'Alterna (mês de 31 dias)':par.has(1)?'Dias ímpares':'Dias pares';
    const [na,nb]=monthRange(S.m===11?S.y+1:S.y,(S.m+1)%12);
    const nx=[...sched(n,na,nb).entries()].sort((x,y)=>x[0]-y[0])[0];
    h+=`<div class="card"><div class="row"><b style="font-size:17px"><span class="dot" style="background:${n.color}"></span>${esc(n.name)}</b><span class="sp"></span><button class="sec" onclick="openNurse('${n.id}')">Editar</button></div>
    <div class="stats" style="margin:10px 0"><div><div class="big">${p.length}</div><div class="mut">Plantões</div></div><div><div class="big">${p.length*12}h</div><div class="mut">Horas</div></div><div><div class="big">${f.length}</div><div class="mut">Folgas</div></div></div>
    <div class="mut">Padrão neste mês: <b>${parTxt}</b></div>
    ${nx?`<div class="mut" style="margin-top:4px">Continua automaticamente em ${MES[(S.m+1)%12]}: primeiro ${nx[1]==='P'?'plantão':'dia de folga'} em <b>${fmt(nx[0])}</b></div>`:''}
    <div class="row" style="margin-top:10px"><button onclick="openAdjust('${n.id}')">📅 Ajustar início do mês</button></div></div>
    <div class="card"><b>Dias do mês</b><table>`+(ent.map(e=>`<tr><td>${DS[dow(e[0])]} ${fmt(e[0])}</td><td><span class="badge b${e[1]}">${e[1]==='P'?'Plantão 12h':'Folga'}</span></td></tr>`).join('')||'<tr><td class="mut">Sem escala neste mês.</td></tr>')+`</table></div>`;
  }
  app.innerHTML=h;
}
function setSel(id){S.sel=id;S.day=null;save();render()}
function nav(d){S.m+=d;if(S.m<0){S.m=11;S.y--}if(S.m>11){S.m=0;S.y++}S.day=null;save();render()}
function goToday(){const t=new Date();S.y=t.getFullYear();S.m=t.getMonth();S.day=todayN();save();render()}
function pickDay(d){S.day=S.day===d?null:d;save();render()}

/* Modais */
function modal(html){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="md">${html}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeModal()});document.body.appendChild(o)}
function closeModal(){const o=document.getElementById('ov');if(o)o.remove()}

function openNurse(id){
  const n=id?S.nurses.find(x=>x.id===id):null;
  const t=new Date();const def=`${S.y}-${pad(S.m+1)}-${pad(t.getFullYear()===S.y&&t.getMonth()===S.m?t.getDate():1)}`;
  const a=n?n.anchors[0]:{date:def,done:0};
  modal(`<h3 style="margin-top:0">${n?'Editar':'Novo'} enfermeiro</h3>
  <label>Nome</label><input id="fn" value="${n?esc(n.name):''}" placeholder="Ex.: Maria Silva">
  <label>Cor</label><input id="fc" type="color" value="${n?n.color:CORES[S.nurses.length%CORES.length]}">
  ${n?`<label>Ajustes de ciclo cadastrados</label>${n.anchors.slice().sort((x,y)=>x.date<y.date?-1:1).map(x=>`<div class="row" style="margin-bottom:4px"><span class="mut sp">Início ${x.date.split('-').reverse().join('/')} · ${x.done} plantão(ões) desde a última folga</span>${n.anchors.length>1?`<button class="sec" style="padding:4px 10px" onclick="delAnchor('${n.id}','${x.date}')">✕</button>`:''}</div>`).join('')}`:`
  <label>Dia do 1º plantão</label><input id="fd" type="date" value="${a.date}">
  <label>Plantões já feitos desde a última folga</label>
  <select id="fx">${[0,1,2,3,4].map(i=>`<option value="${i}">${i}${i===0?' (começando um ciclo novo)':''}</option>`).join('')}</select>`}
  <div class="row" style="margin-top:16px">${n?`<button class="danger" onclick="delNurse('${n.id}')">Excluir</button>`:''}<span class="sp"></span><button class="sec" onclick="closeModal()">Cancelar</button><button onclick="saveNurse('${id||''}')">Salvar</button></div>`);
}
function saveNurse(id){
  const name=document.getElementById('fn').value.trim();
  if(!name){alert('Informe o nome.');return}
  const color=document.getElementById('fc').value;
  if(id){const n=S.nurses.find(x=>x.id===id);n.name=name;n.color=color}
  else{
    const date=document.getElementById('fd').value;if(!date){alert('Informe a data do 1º plantão.');return}
    const done=+document.getElementById('fx').value;
    const n={id:'n'+Date.now(),name,color,anchors:[{date,done}]};
    S.nurses.push(n);S.sel=n.id;const p=date.split('-');S.y=+p[0];S.m=+p[1]-1;
  }
  save();closeModal();render();
}
function delNurse(id){if(!confirm('Excluir este enfermeiro e toda a escala dele?'))return;S.nurses=S.nurses.filter(x=>x.id!==id);S.sel='all';save();closeModal();render()}
function delAnchor(id,date){const n=S.nurses.find(x=>x.id===id);n.anchors=n.anchors.filter(x=>x.date!==date);save();openNurse(id);render()}

function openAdjust(id){
  const n=S.nurses.find(x=>x.id===id);
  const [a,b]=monthRange(S.y,S.m);
  const f=[...sched(n,a,b).entries()].sort((x,y)=>x[0]-y[0])[0];
  const def=isoOf(f?f[0]:a);
  modal(`<h3 style="margin-top:0">Ajustar início – ${esc(n.name)}</h3>
  <p class="mut">Por padrão o cálculo já continua sozinho de um mês para o outro. Use isto só se o início real do plantão em <b>${MES[S.m]}</b> for diferente do calculado (troca de plantão, atestado, mudança de escala).</p>
  <label>Dia em que começa o plantão</label><input id="ad" type="date" value="${def}">
  <label>Plantões já feitos desde a última folga</label>
  <select id="ax">${[0,1,2,3,4].map(i=>`<option value="${i}">${i}${i===0?' (ciclo novo)':''}</option>`).join('')}</select>
  <div class="row" style="margin-top:16px"><span class="sp"></span><button class="sec" onclick="closeModal()">Cancelar</button><button onclick="saveAdjust('${id}')">Recalcular</button></div>`);
}
function saveAdjust(id){
  const n=S.nurses.find(x=>x.id===id);const date=document.getElementById('ad').value;if(!date)return;
  const done=+document.getElementById('ax').value;
  n.anchors=n.anchors.filter(x=>x.date!==date);n.anchors.push({date,done});
  save();closeModal();render();
}

function openMenu(){
  modal(`<h3 style="margin-top:0">Menu</h3>
  <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
  <button class="sec" onclick="exportData()">⬇️ Exportar backup (.json)</button>
  <button class="sec" onclick="document.getElementById('imp').click()">⬆️ Importar backup</button>
  <button class="sec" onclick="closeModal();window.print()">🖨️ Imprimir / salvar PDF</button>
  <button class="danger" onclick="clearAll()">Apagar todos os dados</button></div>
  <p class="mut">Os dados ficam salvos só neste aparelho (localStorage). Faça backup de vez em quando.</p>
  <input type="file" id="imp" accept=".json,application/json" hidden onchange="importData(event)">`);
}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='escala-enfermagem-backup.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!Array.isArray(s.nurses))throw 0;S=s;save();closeModal();render()}catch(x){alert('Arquivo inválido.')}};r.readAsText(f)}
function clearAll(){if(confirm('Apagar TODOS os dados deste aparelho?')){localStorage.removeItem(KEY);S=load();closeModal();render()}}

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
